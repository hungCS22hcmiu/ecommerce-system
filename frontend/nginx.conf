server {
    listen 3000;
    root /usr/share/nginx/html;
    index index.html;

    # Forward API calls to the main Nginx reverse proxy
    location /api {
        proxy_pass         http://nginx:80;
        proxy_set_header   Host              $http_host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
    }

    # Cache static assets aggressively (content-hashed filenames from Vite)
    location ~* \.(js|css|png|jpg|jpeg|ico|svg|woff|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA fallback — all routes serve index.html so React Router handles them
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}

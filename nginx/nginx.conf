worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Rate limiting: general API 10 req/s; auth endpoints stricter at 5 req/min
    limit_req_zone $binary_remote_addr zone=api_limit:10m  rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=5r/m;
    limit_req_status 429;

    # Correlation ID: reuse client-supplied value or fall back to Nginx's $request_id
    # $request_id is a 32-hex-char UUID generated per request (Nginx ≥ 1.11.0)
    map $http_x_correlation_id $correlation_id {
        default $http_x_correlation_id;
        ""      $request_id;
    }

    log_format main '$remote_addr [$time_local] "$request" $status '
                    'corr=$correlation_id rt=${request_time}s';
    access_log /var/log/nginx/access.log main;

    # Upstream definitions
    upstream user_service    { server user-service:8001; }
    upstream product_service { server product-service:8081; }
    upstream cart_service    { server cart-service:8002; }
    upstream order_service   { server order-service:8082; }
    upstream payment_service { server payment-service:8003; }
    upstream frontend        { server frontend:3000; }

    server {
        listen 80;
        server_name _;

        # Security headers applied to all responses
        add_header X-Content-Type-Options  "nosniff"                                  always;
        add_header X-Frame-Options         "DENY"                                     always;
        add_header X-XSS-Protection        "1; mode=block"                            always;
        add_header Referrer-Policy         "no-referrer"                              always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none'" always;

        # CORS — explicit origin for React dev server; update for production domain
        add_header Access-Control-Allow-Origin  "http://localhost:3001"                                          always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS"                               always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Seller-Id, X-User-Id, X-Correlation-ID" always;

        # OPTIONS preflight — return 204 immediately
        if ($request_method = OPTIONS) {
            return 204;
        }

        # ── User Service: auth + user management ────────────────────────────
        location /api/v1/auth {
            limit_req zone=auth_limit burst=3 nodelay;  # stricter: 5 req/min, brute-force protection
            limit_req zone=api_limit  burst=5 nodelay;
            proxy_pass         http://user_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Correlation-ID  $correlation_id;
        }

        location /api/v1/users {
            limit_req zone=api_limit burst=5 nodelay;
            proxy_pass         http://user_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Correlation-ID  $correlation_id;
        }

        # ── Product Service: catalog + inventory ────────────────────────────
        location /api/v1/categories {
            limit_req zone=api_limit burst=5 nodelay;
            proxy_pass         http://product_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Correlation-ID  $correlation_id;
        }

        location /api/v1/products {
            limit_req zone=api_limit burst=5 nodelay;
            proxy_pass         http://product_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Correlation-ID  $correlation_id;
        }

        # Internal-only stock mutations — blocked from external clients.
        # reserve/release are called service-to-service (order-service → product-service:8081).
        location ~ ^/api/v1/inventory/[^/]+/(reserve|release)$ {
            return 403;
        }

        location /api/v1/inventory {
            limit_req zone=api_limit burst=5 nodelay;
            proxy_pass         http://product_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Correlation-ID  $correlation_id;
        }

        # ── Cart Service ─────────────────────────────────────────────────────
        location /api/v1/cart {
            limit_req zone=api_limit burst=5 nodelay;
            proxy_pass         http://cart_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Correlation-ID  $correlation_id;
        }

        # ── Order Service ────────────────────────────────────────────────────
        # Seller-only transitions — blocked from external clients.
        # Must be called via internal Docker network directly (order-service:8082).
        location ~ ^/api/v1/orders/[^/]+/(ship|deliver)$ {
            return 403;
        }

        location /api/v1/orders {
            limit_req zone=api_limit burst=5 nodelay;
            proxy_pass         http://order_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Correlation-ID  $correlation_id;
        }

        # ── Payment Service ──────────────────────────────────────────────────
        location /api/v1/payments {
            limit_req zone=api_limit burst=5 nodelay;
            proxy_pass         http://payment_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Correlation-ID  $correlation_id;
        }

        # ── Health checks (not rate-limited) ────────────────────────────────
        # Routes to payment-service: the only service that checks both postgres + kafka.
        location /health/ {
            proxy_pass         http://payment_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
            proxy_set_header   X-Correlation-ID  $correlation_id;
        }

        # ── Frontend SPA (must be last — catches all non-API routes) ────────
        location / {
            proxy_pass         http://frontend;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }
    }
}

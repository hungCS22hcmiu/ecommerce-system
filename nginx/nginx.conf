worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Rate limiting: 10 req/s per IP, 10MB shared zone
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_status 429;

    # Upstream definitions
    upstream user_service    { server user-service:8001; }
    upstream product_service { server product-service:8081; }
    upstream cart_service    { server cart-service:8002; }
    upstream order_service   { server order-service:8082; }
    upstream payment_service { server payment-service:8003; }

    server {
        listen 80;
        server_name _;

        # Security headers applied to all responses
        add_header X-Content-Type-Options  "nosniff"        always;
        add_header X-Frame-Options         "DENY"           always;
        add_header X-XSS-Protection        "1; mode=block"  always;

        # CORS — tighten to specific origin in Week 16 security hardening
        add_header Access-Control-Allow-Origin  "*"                                                              always;
        add_header Access-Control-Allow-Methods "GET, POST, PUT, DELETE, OPTIONS"                               always;
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-Seller-Id, X-User-Id, X-Correlation-ID" always;

        # OPTIONS preflight — return 204 immediately
        if ($request_method = OPTIONS) {
            return 204;
        }

        # ── User Service: auth + user management ────────────────────────────
        location /api/v1/auth {
            limit_req zone=api_limit burst=5 nodelay;
            proxy_pass         http://user_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        location /api/v1/users {
            limit_req zone=api_limit burst=5 nodelay;
            proxy_pass         http://user_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        # ── Product Service: catalog + inventory ────────────────────────────
        location /api/v1/products {
            limit_req zone=api_limit burst=5 nodelay;
            proxy_pass         http://product_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        location /api/v1/inventory {
            limit_req zone=api_limit burst=5 nodelay;
            proxy_pass         http://product_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        # ── Cart Service ─────────────────────────────────────────────────────
        location /api/v1/cart {
            limit_req zone=api_limit burst=5 nodelay;
            proxy_pass         http://cart_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        # ── Order Service ────────────────────────────────────────────────────
        location /api/v1/orders {
            limit_req zone=api_limit burst=5 nodelay;
            proxy_pass         http://order_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        # ── Payment Service ──────────────────────────────────────────────────
        location /api/v1/payments {
            limit_req zone=api_limit burst=5 nodelay;
            proxy_pass         http://payment_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }

        # ── Health checks (not rate-limited) ────────────────────────────────
        # Routes to payment-service: the only service that checks both postgres + kafka.
        location /health/ {
            proxy_pass         http://payment_service;
            proxy_set_header   Host              $host;
            proxy_set_header   X-Real-IP         $remote_addr;
            proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        }
    }
}
